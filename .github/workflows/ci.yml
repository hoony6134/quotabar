name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: QuotaBar
            destination: platform=macOS
          - scheme: QuotaBarWidget
            destination: platform=macOS
          - scheme: QuotaBarMobile
            destination: generic/platform=iOS
          - scheme: QuotaBarWatch
            destination: generic/platform=watchOS
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          [ -n "$XC" ] || { echo "Xcode 26 not found"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project QuotaBar.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | tail -n 40

      - name: Show compiler errors on failure
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -50 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.scheme }}
          path: build.log
