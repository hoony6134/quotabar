name: Release (macOS)

# 태그 v* 를 푸시하면 Developer ID 서명 → 공증 → DMG → GitHub Release 까지 자동 진행.
# 수동 실행(workflow_dispatch)은 릴리스 생성 없이 공증된 DMG를 아티팩트로만 남긴다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 2.0.0). 비우면 project.yml 값 사용'
        required: false

permissions:
  contents: write

env:
  TEAM_ID: 2S9H42VJUA

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="$(grep -m1 MARKETING_VERSION project.yml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V (build ${GITHUB_RUN_NUMBER})"

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Import Developer ID Application certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project QuotaBar.xcodeproj \
            -scheme QuotaBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/QuotaBar.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            archive | tail -n 30

      - name: Export (Developer ID)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/QuotaBar.xcarchive" \
            -exportOptionsPlist Config/ExportOptions-DeveloperID.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" | tail -n 30

      - name: Notarize app
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/QuotaBar.app" "$RUNNER_TEMP/QuotaBar.zip"
          xcrun notarytool submit "$RUNNER_TEMP/QuotaBar.zip" \
            --key "$ASC_KEY_PATH" \
            --key-id "${{ secrets.ASC_KEY_ID }}" \
            --issuer "${{ secrets.ASC_ISSUER_ID }}" \
            --wait
          xcrun stapler staple "$RUNNER_TEMP/export/QuotaBar.app"
          xcrun stapler validate "$RUNNER_TEMP/export/QuotaBar.app"
          spctl -a -vv -t exec "$RUNNER_TEMP/export/QuotaBar.app"

      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          create-dmg \
            --volname "QuotaBar $VERSION" \
            --app-drop-link 450 185 \
            --icon "QuotaBar.app" 150 185 \
            --window-size 600 400 \
            "dist/QuotaBar-$VERSION.dmg" \
            "$RUNNER_TEMP/export/QuotaBar.app"

      - name: Notarize DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          xcrun notarytool submit "dist/QuotaBar-$VERSION.dmg" \
            --key "$ASC_KEY_PATH" \
            --key-id "${{ secrets.ASC_KEY_ID }}" \
            --issuer "${{ secrets.ASC_ISSUER_ID }}" \
            --wait
          xcrun stapler staple "dist/QuotaBar-$VERSION.dmg"
          shasum -a 256 "dist/QuotaBar-$VERSION.dmg" | tee "dist/QuotaBar-$VERSION.dmg.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuotaBar-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Cleanup keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys"
