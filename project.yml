# XcodeGen 설정 — macOS 앱 + macOS 위젯 + iOS 앱 + iOS 위젯 + Apple Watch 앱 (QuotaBar 2.0)
# 사용법:
#   brew install xcodegen   # 없으면
#   xcodegen generate
#   open QuotaBar.xcodeproj # Signing & Capabilities에서 Team 선택 후 Run
name: QuotaBar
options:
  bundleIdPrefix: com.wevoid
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "8"

targets:
  # ───────────────────────── macOS (Developer ID 직접 배포) ─────────────────────────
  QuotaBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/QuotaBar
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Config/QuotaBarApp-Info.plist
      properties:
        CFBundleDisplayName: QuotaBar
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "8"
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
    entitlements:
      path: Config/QuotaBar.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.wevoid.quotabar
        # iPhone 미러링(iCloud 키-값 저장소)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.wevoid.quotabar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wevoid.quotabar
        # Developer ID 직접 배포(공증)에 필요
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: QuotaBarWidget
        embed: true

  QuotaBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuotaBarWidget
      # 앱·위젯·iOS가 공유하는 스냅샷 모델/테마/동기화
      - path: Sources/QuotaBar/Shared
      # 서비스 로고 PNG (위젯 배지용)
      - path: Sources/QuotaBar/Resources/Logos
        buildPhase: resources
    info:
      path: Config/QuotaBarWidget-Info.plist
      properties:
        CFBundleDisplayName: QuotaBar 위젯
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/QuotaBarWidget.entitlements
      properties:
        # macOS 위젯 익스텐션은 샌드박스 필수
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.wevoid.quotabar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wevoid.quotabar.widget
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: true

  # ───────────────────────── iOS (App Store) ─────────────────────────
  QuotaBarMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/QuotaBarMobile
      - path: Sources/QuotaBar/Shared
      - path: Sources/QuotaBar/Resources/Logos
        buildPhase: resources
    info:
      path: Config/iOS/QuotaBarMobile-Info.plist
      properties:
        CFBundleDisplayName: QuotaBar
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "8"
        LSApplicationCategoryType: public.app-category.utilities
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 표준 암호화만 사용(HTTPS/iCloud) — 수출 규정 문답 생략
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/iOS/QuotaBarMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wevoid.quotabar
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.wevoid.quotabar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wevoid.quotabar.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: QuotaBarMobileWidget
        embed: true
      - target: QuotaBarWatch
        embed: true

  QuotaBarMobileWidget:
    type: app-extension
    platform: iOS
    sources:
      # macOS 위젯과 같은 소스를 공유 (#if os(iOS)로 잠금 화면 위젯 분기)
      - path: Sources/QuotaBarWidget
      - path: Sources/QuotaBar/Shared
      - path: Sources/QuotaBar/Resources/Logos
        buildPhase: resources
      - path: Config/iOS/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Config/iOS/QuotaBarMobileWidget-Info.plist
      properties:
        CFBundleDisplayName: QuotaBar
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/iOS/QuotaBarMobileWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wevoid.quotabar
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.wevoid.quotabar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wevoid.quotabar.mobile.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: NO

  # ───────────────────────── watchOS (iOS 앱에 포함되어 App Store로 배포) ─────────────────────────
  QuotaBarWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/QuotaBarWatch
      # 스냅샷 모델/테마/iCloud 동기화는 앱·위젯·iOS와 공유
      - path: Sources/QuotaBar/Shared
      - path: Sources/QuotaBar/Resources/Logos
        buildPhase: resources
    info:
      path: Config/watchOS/QuotaBarWatch-Info.plist
      properties:
        CFBundleDisplayName: QuotaBar
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "8"
        # iPhone 앱 없이도 설치·동작하는 독립 Watch 앱 (iCloud KVS를 직접 읽는다)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.wevoid.quotabar.mobile
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Config/watchOS/QuotaBarWatch.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.wevoid.quotabar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wevoid.quotabar.mobile.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: QuotaBarWatchWidget
        embed: true

  # Apple Watch 컴플리케이션 (watchOS 위젯 익스텐션)
  QuotaBarWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/QuotaBarWatchWidget
      - path: Sources/QuotaBar/Shared
      # 서비스 로고 PNG (컴플리케이션 아이콘용)
      - path: Sources/QuotaBar/Resources/Logos
        buildPhase: resources
    info:
      path: Config/watchOS/QuotaBarWatchWidget-Info.plist
      properties:
        CFBundleDisplayName: QuotaBar
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/watchOS/QuotaBarWatchWidget.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.wevoid.quotabar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wevoid.quotabar.mobile.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: NO

schemes:
  QuotaBar:
    build:
      targets:
        QuotaBar: all
        QuotaBarWidget: all
    run:
      config: Debug
      executable: QuotaBar

  QuotaBarWidget:
    build:
      targets:
        QuotaBarWidget: all

  QuotaBarMobile:
    build:
      targets:
        QuotaBarMobile: all
        QuotaBarMobileWidget: all
        QuotaBarWatch: all
    run:
      config: Debug
      executable: QuotaBarMobile
    archive:
      config: Release

  QuotaBarWatch:
    build:
      targets:
        QuotaBarWatch: all
        QuotaBarWatchWidget: all
    run:
      config: Debug
      executable: QuotaBarWatch
